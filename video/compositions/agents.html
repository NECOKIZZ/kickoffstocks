<!doctype html>
<html>
  <head><meta charset="UTF-8" /></head>
  <body>
    <template>
      <style>
        #agents { position: absolute; inset: 0; }
        #agents .page h1 { font-size: 44px; }
        #agents .lede { max-width: 540px !important; }
        #agents .step { font-family: var(--f-clash); font-weight: 600; font-size: 11px; letter-spacing: 0.16em; color: #3C3E37; margin-top: 26px; }
        #agents .url { margin-top: 10px; width: 560px; height: 58px; border-radius: 18px; background: #EDEAE0; display: flex; align-items: center; padding: 0 10px 0 16px; font-size: 15px; }
        #agents .url .b { background: #5F49E0; margin-left: auto; height: 40px; padding: 0 18px; font-size: 14px; border-radius: 12px; box-shadow: 0 4px 0 #4E3CB5; }
        #agents .asks { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; width: 560px; }
        #agents .asks span { padding: 8px 14px; border-radius: 12px; background: #EDEAE0; font-size: 14px; }
        #agents .safe { margin-top: 22px; width: 560px; padding: 18px 20px; border-radius: 22px; }
        #agents .safe .r { display: flex; gap: 12px; align-items: center; font-size: 15px; height: 32px; }
        #agents .safe .r b { color: #007A03; }
        #agents .chat { position: absolute; left: 892px; top: 56px; width: 528px; height: 738px; border-radius: 30px; background: #111210; color: #F7F5F0; padding: 18px 20px; display: flex; flex-direction: column; z-index: 10; box-shadow: 0 30px 70px rgba(0,0,0,0.25); }
        #agents .ch { display: flex; align-items: center; gap: 10px; padding-bottom: 14px; border-bottom: 1px solid rgba(255,255,255,0.08); }
        #agents .ch .av { width: 32px; height: 32px; border-radius: 10px; background: #7B62F6; display: flex; align-items: center; justify-content: center; }
        #agents .ch .t { font-family: var(--f-clash); font-weight: 600; font-size: 15px; }
        #agents .ch .s { font-size: 12px; color: rgba(247,245,240,0.55); }
        #agents .ch .mcp { margin-left: auto; font-family: var(--f-mono); font-size: 11px; padding: 4px 10px; border-radius: 999px; background: rgba(0,200,5,0.14); color: #4ADE80; }
        #agents .msgs { flex: 1; padding-top: 16px; display: flex; flex-direction: column; gap: 10px; }
        #agents .you { align-self: flex-end; max-width: 400px; background: #5F49E0; color: #fff; padding: 12px 16px; border-radius: 18px 18px 4px 18px; font-size: 15px; line-height: 1.4; min-height: 46px; }
        #agents .tool { display: flex; align-items: center; gap: 10px; padding: 9px 12px; border-radius: 12px; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.08); font-size: 13px; }
        #agents .tool .fn { font-family: var(--f-mono); font-size: 12.5px; color: #C9BEFF; }
        #agents .tool .res { color: rgba(247,245,240,0.65); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        #agents .tool .ok { margin-left: auto; width: 20px; height: 20px; border-radius: 50%; background: #00C805; color: #0B0B0B; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 800; flex-shrink: 0; }
        #agents .bot { max-width: 450px; background: rgba(255,255,255,0.07); padding: 14px 16px; border-radius: 18px 18px 18px 4px; font-size: 15px; line-height: 1.45; }
        #agents .bot .hand { display: flex; gap: 8px; margin-top: 10px; }
        #agents .typing { position: absolute; left: 20px; top: 172px; display: flex; gap: 6px; padding: 12px 16px; border-radius: 18px; background: rgba(255,255,255,0.07); align-self: flex-start; }
        #agents .typing i { width: 8px; height: 8px; border-radius: 50%; background: rgba(247,245,240,0.6); display: block; }
        #agents .wp { position: absolute; left: 930px; top: 380px; width: 452px; z-index: 20; background: #F7F5F0; border-radius: 24px; padding: 22px; box-shadow: 0 30px 80px rgba(0,0,0,0.4); }
        #agents .wp .hdr { display: flex; align-items: center; gap: 10px; }
        #agents .wp .ic { width: 34px; height: 34px; border-radius: 10px; background: #0B8F3A; color: #fff; display: flex; align-items: center; justify-content: center; font-family: var(--f-card); font-weight: 900; }
        #agents .wp .t { font-family: var(--f-clash); font-weight: 600; font-size: 16px; }
        #agents .wp .s { font-size: 12px; color: #6B6F63; }
        #agents .wp .li { margin-top: 12px; border-radius: 14px; background: #fff; border: 1px solid rgba(107,111,99,0.16); }
        #agents .wp .li div { display: flex; justify-content: space-between; padding: 9px 14px; font-size: 14px; border-top: 1px solid rgba(107,111,99,0.12); }
        #agents .wp .li div:first-child { border-top: 0; }
        #agents .wp .li span:last-child { font-family: var(--f-mono); font-size: 12.5px; color: #4C4F46; }
        #agents .wp .btns { display: flex; gap: 10px; margin-top: 14px; }
        #agents .wp .btns .btn3d { flex: 1; height: 46px; font-size: 15px; }
        #agents .wp .signed { position: absolute; inset: 0; border-radius: 24px; background: #F7F5F0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; opacity: 0; }
        #agents .wp .signed .big { width: 56px; height: 56px; border-radius: 50%; background: #00C805; display: flex; align-items: center; justify-content: center; font-size: 28px; font-weight: 800; }
        #agents .wp .signed .t { font-size: 20px; }
        #agents .join { position: absolute; left: 292px; top: 690px; width: 560px; height: 58px; border-radius: 18px; background: #fff; box-shadow: 0 1px 2px rgba(0,0,0,0.05), 0 8px 24px rgba(0,0,0,0.08); display: flex; align-items: center; gap: 12px; padding: 0 16px; z-index: 5; }
        #agents .join .nm { font-family: var(--f-clash); font-weight: 600; font-size: 16px; }
        #agents .join .lg { display: flex; }
        #agents .join .lg img { width: 22px; height: 22px; border-radius: 50%; border: 2px solid #fff; margin-left: -6px; background: #fff; }
        #agents .join .r { margin-left: auto; font-size: 13px; color: #6B6F63; }
      </style>
      <div id="agents" data-composition-id="agents" data-width="1920" data-height="1080">
        <div class="app-stage">
          <div class="cam" id="agents-cam">
            <div class="app">
              <div id="agents-side"></div>
              <div class="main">
                <div id="agents-tape"></div>
                <div class="page">
                  <div class="eyebrow">Agents</div>
                  <h1>Bring your own agent</h1>
                  <div class="lede">Claude, ChatGPT, Cursor or an agent you built: it reads the round, builds ETFs and backs teams. It prepares every transaction; your wallet signs.</div>
                  <div class="step">1 · ADD THE MCP SERVER TO YOUR AGENT</div>
                  <div class="url"><span>https://stocks.kickoff.cash/api/mcp</span><span class="btn3d purple b">Copy</span></div>
                  <div class="step">2 · JUST ASK</div>
                  <div class="asks"><span>“What's happening in this round?”</span><span>“Back the ETF above MEDIAN with $5”</span><span>“Build me an AI chips ETF”</span><span>“Did I win? Claim it for me”</span></div>
                  <div class="card safe" id="agents-safe">
                    <div class="r"><b>✓</b>Your agent shows every transaction and waits for your yes.</div>
                    <div class="r"><b>✓</b>Your keys stay in your wallet. We never hold a key.</div>
                    <div class="r"><b>✓</b>We never run your agent: it reads the same public data you do.</div>
                  </div>
                </div>
              </div>
              <div class="join" id="agents-join"><span class="pill ag">Agent</span><span class="nm">Agent Alpha</span><span class="lg">${""}</span><span class="r">joined Round 12 · 64 ETFs</span></div>
              <div class="chat" id="agents-chat" data-layout-allow-overlap>
                <div class="ch"><div class="av"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round"><rect x="4" y="8" width="16" height="11" rx="3"/><path d="M12 4v4M9 13h.01M15 13h.01"/></svg></div>
                  <div><div class="t">Your agent</div><div class="s">wallet 0x3c1e…77b4 · Robinhood Chain</div></div><span class="mcp">MCP · kickoff-stocks</span></div>
                <div class="msgs">
                  <div class="you" id="agents-you"><span id="agents-q"></span></div>
                  <div class="typing" id="agents-dots"><i></i><i></i><i></i></div>
                  <div class="tool" id="agents-t0"><span class="fn">get_round</span><span class="res">Round 12 · entries open · 63 ETFs</span><span class="ok">✓</span></div>
                  <div class="tool" id="agents-t1"><span class="fn">list_stocks</span><span class="res">37 assets · live prices · BTC/ETH ≤ 20%</span><span class="ok">✓</span></div>
                  <div class="tool" id="agents-t2"><span class="fn">get_rules</span><span class="res">3–10 stocks · ≥ $10 · ≤ 50% each · $5 ticket</span><span class="ok">✓</span></div>
                  <div class="tool" id="agents-t3"><span class="fn">plan_create_etf</span><span class="res">“Agent Alpha” · 3 txs prepared</span><span class="ok">✓</span></div>
                  <div class="bot" id="agents-bot">Ready. <b>Agent Alpha</b>: NVDA 30% · PLTR 25% · MSFT 25% · BTC 20%, a $100 basket and a $5 ticket. Please sign the 3 transactions in your wallet.
                    <div class="hand" id="agents-hand"></div></div>
                </div>
              </div>
              <div class="wp" id="agents-wp" data-layout-allow-overlap>
                <div class="hdr"><span class="ic">R</span><div><div class="t">Robinhood Wallet</div><div class="s">stocks.kickoff.cash wants you to sign</div></div></div>
                <div class="li"><div><span>Approve stocks</span><span>NVDA · PLTR · MSFT · BTC</span></div><div><span>Approve USDG</span><span>5.00 USDG</span></div><div><span>Lock basket + ticket</span><span>LeagueEscrow</span></div></div>
                <div class="btns"><span class="btn3d cream">Reject</span><span class="btn3d purple" id="agents-ok">Confirm all</span></div>
                <div class="signed" id="agents-signed" data-layout-allow-overlap><div class="big">✓</div><div class="t clash">Signed · 3 of 3</div></div>
              </div>
              <div class="cursor" id="agents-cur" style="width:26px;height:26px"></div>
              <div class="ripple" id="agents-rip"></div>
            </div>
          </div>
          <div class="sample">Sample round · prices: Robinhood Chain feeds, 6 Oct</div>
        </div>
      </div>
      <script>
        (function () {
          document.getElementById("agents-side").innerHTML = KS.sidebar("agents", { addr: "0x3c1e…77b4", bal: "180 USDG" });
          document.getElementById("agents-tape").innerHTML = KS.tickerTape("agents-track");
          document.getElementById("agents-cur").innerHTML = KS.CURSOR.replace(/34/g, "26");
          document.querySelector("#agents-join .lg").innerHTML = ["NVDA", "PLTR", "MSFT", "BTC"].map((t) => `<img src="${KS.L(t)}">`).join("");
          document.getElementById("agents-hand").innerHTML = [["NVDA", 30], ["PLTR", 25], ["MSFT", 25], ["BTC", 20]].map(([t, w]) => KS.card(t, "tiny", { weight: w })).join("");
          KS.layered(`[data-composition-id="agents"] .app *`);
          const tl = gsap.timeline({ paused: true });
          tl.fromTo("#agents-track", { x: 0 }, { x: -1900, duration: 21, ease: "none" }, 0);
          tl.fromTo("#agents .page > *", { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.5, stagger: 0.06, ease: "power3.out" }, 0.15);
          tl.fromTo("#agents-chat", { opacity: 0, x: 60 }, { opacity: 1, x: 0, duration: 0.8, ease: "power3.out" }, 0.6);
          // Camera into the chat.
          tl.fromTo("#agents-cam", { scale: 1, x: 0, y: 0 }, { scale: 1.22, x: -1180, y: -60, duration: 1.4, ease: "power2.inOut" }, 1.0);
          const q = "Build me an AI ETF with a little Bitcoin, call it Agent Alpha, and lock it with $5.";
          const qe = document.getElementById("agents-q");
          const o = { n: 0 };
          tl.fromTo("#agents-you", { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.3 }, 1.4);
          tl.fromTo(o, { n: 0 }, { n: q.length, duration: 2.0, ease: "none", onUpdate: () => (qe.textContent = q.slice(0, Math.round(o.n))) }, 1.5);
          tl.fromTo("#agents-dots", { opacity: 0 }, { opacity: 1, duration: 0.2 }, 3.7);
          tl.fromTo("#agents-dots i", { y: 0 }, { y: -5, duration: 0.25, stagger: 0.12, yoyo: true, repeat: 3, ease: "sine.inOut" }, 3.7);
          tl.to("#agents-dots", { opacity: 0, duration: 0.15 }, 4.6);
          const ts = [4.6, 5.9, 7.1, 8.5];
          ts.forEach((at, i) => {
            tl.fromTo("#agents-t" + i, { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.35, ease: "power2.out" }, at);
            tl.fromTo(`#agents-t${i} .ok`, { scale: 0, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.3, ease: "back.out(2.5)" }, at + 0.6);
          });
          tl.fromTo("#agents-bot", { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, 9.6);
          tl.fromTo("#agents-hand .sc", { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.35, stagger: 0.07, ease: "back.out(1.8)" }, 10.0);
          // Wallet prompt: the user signs.
          tl.fromTo("#agents-wp", { opacity: 0, y: 40, scale: 0.95 }, { opacity: 1, y: 0, scale: 1, duration: 0.5, ease: "back.out(1.4)" }, 11.2);
          tl.fromTo("#agents-cur", { x: 1300, y: 760, opacity: 0, scale: 1 }, { x: 1260, y: 720, opacity: 1, duration: 0.3 }, 11.6);
          let t = KS.click(tl, "#agents-cur", "#agents-rip", 1270, 655, 11.9, 0.8);
          tl.fromTo("#agents-signed", { opacity: 0 }, { opacity: 1, duration: 0.3 }, t);
          tl.fromTo("#agents-signed .big", { scale: 0.3 }, { scale: 1, duration: 0.45, ease: "back.out(2.5)" }, t);
          tl.to("#agents-cur", { opacity: 0, duration: 0.3 }, t + 0.2);
          tl.to("#agents-wp", { opacity: 0, y: 20, scale: 0.97, duration: 0.4, ease: "power2.in" }, t + 1.3);
          // Pull back: the agent's ETF joins the league.
          tl.to("#agents-cam", { scale: 1, x: 0, y: 0, duration: 1.3, ease: "power2.inOut" }, t + 1.3);
          tl.fromTo("#agents-join", { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.6, ease: "back.out(1.5)" }, t + 2.2);
          tl.fromTo("#agents-safe", { boxShadow: "0 0 0 0 rgba(0,200,5,0)" }, { boxShadow: "0 0 0 4px rgba(0,200,5,0.5)", duration: 0.5, yoyo: true, repeat: 1, ease: "sine.inOut" }, t + 3.0);
          window.__timelines["agents"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
